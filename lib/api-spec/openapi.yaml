openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: export
    description: Framer site export operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /export/start:
    post:
      operationId: startExport
      tags: [export]
      summary: Start a Framer site export
      description: Accepts a Framer site URL and starts a background export job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExportBody"
      responses:
        "200":
          description: Export job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartExportResponse"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /export/{jobId}/status:
    get:
      operationId: getExportStatus
      tags: [export]
      summary: Get export job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StartExportBody:
      type: object
      properties:
        url:
          type: string
          description: The URL of the Framer site to export
      required:
        - url
    StartExportResponse:
      type: object
      properties:
        jobId:
          type: string
        message:
          type: string
      required:
        - jobId
        - message
    ExportStatus:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, processing, done, error]
        message:
          type: string
        downloadUrl:
          type: string
      required:
        - jobId
        - status
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
